name: Godot 4 Zombie Outbreak - validation and web build

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and web export templates on CI runner
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Verify Godot version
        run: godot --version
      - name: Install verified CC0 game models
        run: python3 tools/install_cc0_art.py
      - name: Import project and parse scripts
        run: godot --headless --editor --path . --import --quit
      - name: Run scripted scene smoke test
        run: godot --headless --path . --script res://tests/smoke.gd
      - name: Visual QA - render actual Godot frame and reject runtime script errors
        run: |
          mkdir -p build
          set -o pipefail
          xvfb-run -a godot --rendering-driver opengl3 --path . --script res://tests/render_preview.gd 2>&1 | tee build/render.log
          if grep -q 'SCRIPT ERROR:' build/render.log; then
            echo 'Runtime GDScript error during visual rendering'
            exit 1
          fi
          test -s build/preview.png
      - name: Export browser version
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Web" build/index.html
      - name: Commit tested web export to site for live preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          find site -maxdepth 1 -type f -delete
          cp -a build/. site/
          touch site/.nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/
          if ! git diff --cached --quiet; then
            git commit -m 'build: update playable Godot Web preview'
            git push origin HEAD:main
          fi
      - name: Save Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zombie-outbreak-godot-web
          path: build/
          if-no-files-found: error
